<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Informasi Manajemen Proyek Pembangunan Sekolah</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-title">SIM Proyek Sekolah</div>
        <div class="brand-sub">Manajemen Proyek Pembangunan</div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">v1.0 — Dinas Pendidikan</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="topbar-title" id="page-title">Proyek</div>
        <div class="topbar-right">
          <label for="proj-select" class="mini-label">Proyek aktif</label>
          <select id="proj-select"></select>
          <span class="user-chip" id="user-chip" hidden>
            <span class="u-name" id="user-name"></span>
            <span class="u-role" id="user-role"></span>
          </span>
          <button class="btn sm" id="btn-logout" title="Akhiri sesi dan keluar">Keluar</button>
        </div>
      </header>
      <main id="content" class="content"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
